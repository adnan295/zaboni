name: zaboni

# Docker keeps container logs forever by default (json-file, no size limit), so
# chatty services (api-server, WARP) slowly fill the disk. Cap every service at
# 3 rotated files of 20 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zaboni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-zaboni}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zaboni}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/api-server.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      warp:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "8080"
      # Route the WhatsApp connection through the WARP proxy so WhatsApp sees a
      # non-blocked IP (the server's own IP is region-blocked → statusCode 405).
      # Override in .env to point at any other socks5:// or http:// proxy.
      WA_PROXY_URL: ${WA_PROXY_URL:-socks5://warp:1080}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-zaboni}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zaboni}}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET is required}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      LOCAL_STORAGE_PUBLIC_DIR: /data/storage/public
      LOCAL_STORAGE_PRIVATE_DIR: /data/storage/private
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT: ${VAPID_CONTACT:-mailto:admin@zaboni.com}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      APN_KEY: ${APN_KEY:-}
      APN_KEY_ID: ${APN_KEY_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APN_BUNDLE_ID: ${APN_BUNDLE_ID:-com.zaboni.delivery}
      WAVERIFY_API_KEY: ${WAVERIFY_API_KEY:-}
      ADMIN_ALERT_WEBHOOK_URL: ${ADMIN_ALERT_WEBHOOK_URL:-}
      APPLE_REVIEW_PHONE: ${APPLE_REVIEW_PHONE:-}
      # Read-only GitHub token so the direct-download APK keeps mirroring once the
      # repository is private (fine-grained, this repo only, Contents: read).
      APK_GITHUB_TOKEN: ${APK_GITHUB_TOKEN:-}
      # Street routes for the tracking map (the osrm service below). If it is not
      # running the app simply draws straight lines.
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
    volumes:
      - storage-public:/data/storage/public
      - storage-private:/data/storage/private
      - whatsapp-session:/repo/whatsapp-session
      - backup-status:/backup-status:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Cloudflare WARP as a SOCKS5 proxy (listens on warp:1080 inside the compose
  # network). Only the WhatsApp connection is routed through it, to bypass the
  # region block on the server's own IP.
  warp:
    logging: *default-logging
    image: caomingjun/warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp-data:/var/lib/cloudflare-warp

  marsool:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/marsool.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"

  web:
    logging: *default-logging
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api-server
      - marsool
    ports:
      - "127.0.0.1:8090:80"


  # Street routing for the tracking map, from OpenStreetMap's Syria extract.
  # Free and self-hosted. Start once with: docker compose up -d osrm
  # The first start downloads the map (~30 MB) and prepares it (a few minutes);
  # later starts reuse it. Refresh the roads: docker compose run --rm -e OSRM_REFRESH=1 osrm-fetch
  osrm-fetch:
    logging: *default-logging
    image: alpine:3.20
    restart: "no"
    environment:
      OSRM_REFRESH: ${OSRM_REFRESH:-}
    command:
      - sh
      - -c
      - |
        set -e
        if [ -s /data/syria.osm.pbf ] && [ -z "$$OSRM_REFRESH" ]; then echo "map already downloaded"; exit 0; fi
        rm -f /data/syria.osrm*
        wget -q -O /data/syria.osm.pbf.part https://download.geofabrik.de/asia/syria-latest.osm.pbf
        mv /data/syria.osm.pbf.part /data/syria.osm.pbf
        echo "map downloaded"
    volumes:
      - osrm-data:/data

  osrm:
    logging: *default-logging
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    restart: unless-stopped
    depends_on:
      osrm-fetch:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -s /data/syria.osrm.mldgr ]; then
          osrm-extract -p /opt/car.lua /data/syria.osm.pbf
          osrm-partition /data/syria.osrm
          osrm-customize /data/syria.osrm
        fi
        exec osrm-routed --algorithm mld --max-viaroute-size 10 /data/syria.osrm
    volumes:
      - osrm-data:/data

  # Nightly encrypted backups (database + uploaded files) to Cloudflare R2.
  # Disabled until R2 is configured: `docker compose --profile backup up -d`.
  backup:
    logging: *default-logging
    profiles: ["backup"]
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${BACKUP_DATABASE_URL:-${DATABASE_URL:-postgresql://${POSTGRES_USER:-zaboni}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zaboni}}}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-zaboni-backups}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - storage-public:/data/storage/public:ro
      - storage-private:/data/storage/private:ro
      - backup-status:/backup-status

volumes:
  postgres-data:
  backup-status:
  storage-public:
  storage-private:
  whatsapp-session:
  warp-data:
  osrm-data:
