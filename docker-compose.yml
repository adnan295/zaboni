name: zaboni

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zaboni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-zaboni}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zaboni}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server:
    build:
      context: .
      dockerfile: docker/api-server.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      warp:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "8080"
      # Route the WhatsApp connection through the WARP proxy so WhatsApp sees a
      # non-blocked IP (the server's own IP is region-blocked → statusCode 405).
      # Override in .env to point at any other socks5:// or http:// proxy.
      WA_PROXY_URL: ${WA_PROXY_URL:-socks5://warp:1080}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-zaboni}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zaboni}}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET is required}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      LOCAL_STORAGE_PUBLIC_DIR: /data/storage/public
      LOCAL_STORAGE_PRIVATE_DIR: /data/storage/private
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT: ${VAPID_CONTACT:-mailto:admin@zaboni.com}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      APN_KEY: ${APN_KEY:-}
      APN_KEY_ID: ${APN_KEY_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APN_BUNDLE_ID: ${APN_BUNDLE_ID:-com.zaboni.delivery}
      WAVERIFY_API_KEY: ${WAVERIFY_API_KEY:-}
      ADMIN_ALERT_WEBHOOK_URL: ${ADMIN_ALERT_WEBHOOK_URL:-}
      APPLE_REVIEW_PHONE: ${APPLE_REVIEW_PHONE:-}
    volumes:
      - storage-public:/data/storage/public
      - storage-private:/data/storage/private
      - whatsapp-session:/repo/whatsapp-session
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Cloudflare WARP as a SOCKS5 proxy (listens on warp:1080 inside the compose
  # network). Only the WhatsApp connection is routed through it, to bypass the
  # region block on the server's own IP.
  warp:
    image: caomingjun/warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp-data:/var/lib/cloudflare-warp

  marsool:
    build:
      context: .
      dockerfile: docker/marsool.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api-server
      - marsool
    ports:
      - "127.0.0.1:8090:80"

volumes:
  postgres-data:
  storage-public:
  storage-private:
  whatsapp-session:
  warp-data:
