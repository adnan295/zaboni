name: zaboni

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zaboni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-zaboni}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zaboni}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-server:
    build:
      context: .
      dockerfile: docker/api-server.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-zaboni}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-zaboni}}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET is required}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      LOCAL_STORAGE_PUBLIC_DIR: /data/storage/public
      LOCAL_STORAGE_PRIVATE_DIR: /data/storage/private
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_CONTACT: ${VAPID_CONTACT:-mailto:admin@zaboni.com}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      APN_KEY: ${APN_KEY:-}
      APN_KEY_ID: ${APN_KEY_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APN_BUNDLE_ID: ${APN_BUNDLE_ID:-com.zaboni.delivery}
      WAVERIFY_API_KEY: ${WAVERIFY_API_KEY:-}
      ADMIN_ALERT_WEBHOOK_URL: ${ADMIN_ALERT_WEBHOOK_URL:-}
      APPLE_REVIEW_PHONE: ${APPLE_REVIEW_PHONE:-}
    volumes:
      - storage-public:/data/storage/public
      - storage-private:/data/storage/private
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api-server
    ports:
      - "127.0.0.1:8090:80"

volumes:
  postgres-data:
  storage-public:
  storage-private:
