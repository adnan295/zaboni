name: Zaboni Android → Google Play

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Store version (x.y.z)'
        required: true
        default: '1.0.17'
      build:
        description: 'Version code higher than every previous Play upload'
        required: true
        default: '109'
      track:
        type: choice
        options: [build-only, internal, production]
        default: build-only

permissions:
  contents: read
concurrency:
  group: zaboni-google-play-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: '1'
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BUILD: ${{ inputs.build }}
      PLAY_TRACK: ${{ inputs.track }}
      EXPO_PUBLIC_API_HOST: zaboni.site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm install --frozen-lockfile
      - name: Validate release and generate Android project
        run: |
          node --test ci/mobile-release.test.mjs
          node ci/mobile-release.mjs configure
          pnpm --filter @workspace/marsool exec expo prebuild --platform android --no-install --skip-dependency-update expo,react,react-native
      - name: Verify existing Play upload certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node ci/mobile-release.mjs android-signing
      - name: Build signed Android App Bundle
        working-directory: artifacts/marsool/android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --max-workers=2
      - uses: ruby/setup-ruby@v1
        if: inputs.track != 'build-only'
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Publish to selected Google Play track
        if: inputs.track != 'build-only'
        run: bundle exec fastlane android publish
      - uses: actions/upload-artifact@v4
        with:
          name: zaboni-android-${{ inputs.version }}-${{ inputs.build }}
          path: artifacts/marsool/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing files
        if: always()
        run: node ci/mobile-release.mjs cleanup
