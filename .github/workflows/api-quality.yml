name: Zaboni quality
# Every push and pull request: type-check every app and library (mobile app,
# API, admin panel, restaurant portal, website), run the API test suite, and
# build the API bundle.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check all apps and libraries
        run: pnpm run typecheck
      - name: API tests
        run: pnpm --filter @workspace/api-server test
      - name: Build API
        run: pnpm --filter @workspace/api-server build
