# Single ingress nginx for the Zaboni/Marsool Docker deployment.
#
# Reproduces the path-based routing used by the Replit artifacts:
#   /admin/             -> admin panel (static SPA)
#   /zaboni-web/         -> legal pages SPA
#   /restaurant-portal/  -> restaurant portal SPA
#   /api, /support, /privacy, /delete-my-account -> api-server container
#
# aaPanel's own nginx site should reverse-proxy the public domain to this
# container's exposed port (see DEPLOYMENT.md) — this file only handles
# routing between the containers, not TLS.

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location = / {
        return 302 /admin/;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /zaboni-web/ {
        alias /usr/share/nginx/html/zaboni-web/;
        try_files $uri $uri/ /zaboni-web/index.html;
    }

    location /restaurant-portal/ {
        alias /usr/share/nginx/html/restaurant-portal/;
        try_files $uri $uri/ /restaurant-portal/index.html;
    }

    location ~ ^/(api|support|privacy|delete-my-account)(/|$) {
        proxy_pass http://api-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Needed for the Socket.IO websocket upgrade at /api/socket.io
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
