# Single ingress nginx for the Zaboni/Marsool Docker deployment.
#
# Reproduces the path-based routing used by the Replit artifacts:
#   /admin/             -> admin panel (static SPA)
#   /zaboni-web/         -> legal pages SPA
#   /restaurant-portal/  -> restaurant portal SPA
#   /api, /support, /privacy, /delete-my-account -> api-server container
#   everything else      -> marsool container (landing page at /, plus the
#                           Expo manifest endpoint and static JS bundles the
#                           mobile app fetches from the site root)
#
# aaPanel's own nginx site should reverse-proxy the public domain to this
# container's exposed port (see DEPLOYMENT.md) — this file only handles
# routing between the containers, not TLS.

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # This nginx sits behind a TLS-terminating proxy; emit relative redirects
    # so e.g. `return 301 /admin/` doesn't bounce clients back to plain http.
    absolute_redirect off;

    # Bare SPA roots → their canonical trailing-slash URLs (otherwise they
    # would fall through to the marsool catch-all below and 404).
    location = /admin             { return 301 /admin/; }
    location = /zaboni-web        { return 301 /zaboni-web/; }
    location = /restaurant-portal { return 301 /restaurant-portal/; }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /zaboni-web/ {
        alias /usr/share/nginx/html/zaboni-web/;
        try_files $uri $uri/ /zaboni-web/index.html;
    }

    location /restaurant-portal/ {
        alias /usr/share/nginx/html/restaurant-portal/;
        try_files $uri $uri/ /restaurant-portal/index.html;
    }

    # NOTE: X-Forwarded-Proto and X-Real-IP are deliberately NOT set here.
    # This nginx is an internal hop behind the TLS-terminating system nginx,
    # which already sets both; overwriting them would tell the api-server
    # every request is plain http (it builds absolute image URLs from
    # x-forwarded-proto) and would replace the client IP with this proxy's.
    # Unset proxy headers pass through unchanged.

    location ~ ^/(api|support|privacy|delete-my-account)(/|$) {
        proxy_pass http://api-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Needed for the Socket.IO websocket upgrade at /api/socket.io
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }

    # Everything else → marsool: the landing page at /, the Expo manifest at
    # / and /manifest (requests carrying an `expo-platform` header), and the
    # /<timestamp>/_expo/... JS bundles and assets referenced by them.
    location / {
        proxy_pass http://marsool:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
}
